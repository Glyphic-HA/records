<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Records</title>
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#16191d">
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
  <link rel="stylesheet" href="/assets/app.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { const t = localStorage.getItem("rc-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="masthead">
    <a class="wordmark" href="#/gallery" aria-label="Records home">
      <span class="wordmark-name">Records</span>
      <span class="wordmark-count" id="total-count"></span>
    </a>
    <nav class="tabs" aria-label="Views">
      <a href="#/gallery" data-view="gallery">Gallery</a>
      <a href="#/list" data-view="list">List</a>
      <a href="#/shelves" data-view="shelves">Shelves</a>
      <a href="#/stats" data-view="stats">Stats</a>
    </nav>
    <div class="tools">
      <button class="tool-btn" id="surprise-btn" type="button" title="Open a random record">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8.5" cy="8.5" r="1.6" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg>
        <span>Surprise me</span>
      </button>
      <span class="sync-note num" id="sync-note" hidden></span>
      <button class="icon-btn" id="sync-btn" type="button" aria-label="Sync with Discogs now" title="Sync with Discogs now" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20 12a8 8 0 0 1-14.3 4.9M4 12a8 8 0 0 1 14.3-4.9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M18.5 3v4.2h-4.2M5.5 21v-4.2h4.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn" id="theme-btn" type="button" aria-label="Switch to light theme" title="Switch theme">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
      </button>
    </div>
  </header>

  <form class="filters" id="filters" role="search" onsubmit="return false">
    <label class="search">
      <span class="sr-only">Search</span>
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="f-q" type="search" placeholder="Search artist, title, label, track" autocomplete="off" enterkeyhint="search">
    </label>
    <label><span class="sr-only">Genre</span><select id="f-genre"><option value="">All genres</option></select></label>
    <label><span class="sr-only">Decade</span><select id="f-decade"><option value="">All decades</option></select></label>
    <label><span class="sr-only">Format</span><select id="f-format"><option value="">All formats</option></select></label>
    <label><span class="sr-only">Sort</span>
      <select id="f-sort">
        <option value="added">Recently added</option>
        <option value="artist">Artist A–Z</option>
        <option value="title">Title A–Z</option>
        <option value="year">Oldest first</option>
        <option value="-year">Newest first</option>
      </select>
    </label>
    <span class="bin-chip" id="f-bin" hidden></span>
    <span class="bin-chip" id="f-who" hidden></span>
    <button type="button" class="text-btn" id="f-clear" hidden>Clear filters</button>
  </form>

  <div class="notice" id="notice" role="alert" hidden></div>
  <main id="view" tabindex="-1"></main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <datalist id="bin-labels"></datalist>
  <datalist id="artist-names"></datalist>

  <dialog class="sheet" id="detail" aria-labelledby="d-title" tabindex="-1"></dialog>

  <script src="/assets/app.js" defer></script>
</body>
</html>
